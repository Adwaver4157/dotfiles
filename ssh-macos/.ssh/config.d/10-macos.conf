# ============================================================
# macOS-only SSH options (dotfiles).
# Stowed via the `ssh-macos` package, which is in macOS OS_PKGS only.
# These keywords (notably UseKeychain) are unknown to OpenSSH on Linux
# and would abort ssh on Linux with "Bad configuration option" — so they
# MUST NOT appear in the cross-platform 00-common.conf.
# ============================================================
Host *
    # Store key passphrases in the macOS Keychain (re-used across reboots)
    UseKeychain yes
