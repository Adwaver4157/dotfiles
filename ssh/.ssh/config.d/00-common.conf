# ============================================================
# Managed common SSH settings (dotfiles).
# Activated by this line near the END of ~/.ssh/config:
#     Include ~/.ssh/config.d/*.conf
# (kept last so per-host blocks in ~/.ssh/config win — ssh uses the
#  FIRST obtained value for each option.)
#
# Goal: reuse one connection (ControlMaster) and avoid the rapid-retry
# pattern that trips fail2ban / sshd rate limits on strict servers.
# ============================================================
Host *
    IgnoreUnknown UseKeychain

    # --- Connection multiplexing: 2nd+ ssh to a host shares one TCP conn ---
    ControlMaster auto
    ControlPath ~/.ssh/sockets/%C      # %C = short hash (avoids 104-char socket-path limit)
    ControlPersist 10m

    # --- Keepalive: stop idle NAT/FW drops; detect dead peers (not too eager) ---
    ServerAliveInterval 60
    ServerAliveCountMax 3
    TCPKeepAlive yes

    # --- Fail fast & don't internally retry-storm (ban avoidance) ---
    ConnectTimeout 10
    ConnectionAttempts 1

    # --- Keys ---
    AddKeysToAgent yes
    UseKeychain yes                    # macOS Keychain; ignored elsewhere via IgnoreUnknown

# ------------------------------------------------------------
# Template for ban-prone / fail2ban-strict login nodes (HPC etc.).
# Put the real host (with HostName/User) in ~/.ssh/config — NOT here
# (this file is committed; host names can be sensitive).
# ------------------------------------------------------------
# Host hpc-login
#     HostName login.example.ac.jp
#     User myname
#     ControlPersist 4h          # keep master long → fewer reconnects = less ban risk
#     ServerAliveInterval 120    # gentler keepalive
#     ServerAliveCountMax 2
