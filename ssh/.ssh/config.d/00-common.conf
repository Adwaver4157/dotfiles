# ============================================================
# Managed common SSH settings (dotfiles) — CROSS-PLATFORM SAFE.
# Included from ~/.ssh/config via:  Include ~/.ssh/config.d/*.conf
# (kept last so per-host blocks in ~/.ssh/config win.)
#
# macOS-only options (e.g. UseKeychain) live in 10-macos.conf, which is
# stowed ONLY on macOS — they must never reach Linux's OpenSSH, which
# aborts on unknown keywords ("Bad configuration option").
#
# NOTE: no trailing/inline comments below — older OpenSSH can fold them
# into option values. Comments are on their own lines.
# ============================================================
Host *
    # Connection multiplexing: 2nd+ ssh to a host shares one TCP connection
    ControlMaster auto
    ControlPath ~/.ssh/sockets/%C
    ControlPersist 10m

    # Keepalive: stop idle NAT/FW drops; detect dead peers
    ServerAliveInterval 60
    ServerAliveCountMax 3
    TCPKeepAlive yes

    # Fail fast; don't internally retry-storm (ban avoidance)
    ConnectTimeout 10
    ConnectionAttempts 1

    # Add keys to the agent on first use (portable; works on Linux too)
    AddKeysToAgent yes

# ------------------------------------------------------------
# Template for ban-prone / fail2ban-strict login nodes (HPC).
# Put the real host (HostName/User) in ~/.ssh/config, not here.
# ------------------------------------------------------------
# Host hpc-login
#     HostName login.example.ac.jp
#     User myname
#     ControlPersist 4h
#     ServerAliveInterval 120
#     ServerAliveCountMax 2
