# ============================================================
# tmux.conf — minimal starter
# ============================================================

# ---- Colors / terminal ----
set  -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features '*:Sync=2026'   # batch frame updates (smoother nvim/claude TUI)

# ---- Sensible defaults ----
set -sg escape-time 10        # faster ESC in nvim
set  -g mouse on
set  -g base-index 1          # windows start at 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g history-limit 50000

# ---- Prefix: Ctrl-a locally, Ctrl-b on remote (SSH) ----
# Prevents collision when nesting: local tmux (C-a) -> ssh -> remote tmux (C-b).
# The same config file works on both: prefix switches based on $SSH_CONNECTION.
if-shell '[ -n "$SSH_CONNECTION" ]' {
  set -g prefix C-b
  unbind C-a
  bind C-b send-prefix
} {
  set -g prefix C-a
  unbind C-b
  bind C-a send-prefix
}

# ---- Visual: distinct status bar so you can tell which layer you're in ----
# Local = blue, Remote (SSH) = green. Lets you see at a glance which tmux you control.
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -g status-style "bg=colour22,fg=white"' \
  'set -g status-style "bg=colour24,fg=white"'

# ---- Reload config ----
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ---- Splits that inherit cwd ----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# ---- Vim-style copy mode ----
setw -g mode-keys vi
bind Enter copy-mode                                    # prefix+Enter で copy-mode に入る
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi r send-keys -X rectangle-toggle   # 矩形選択トグル
bind -T copy-mode-vi Y send-keys -X copy-line          # 1行まるごとコピー

# ============================================================
# Plugins (tpm) — install: prefix + I, update: prefix + U
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'  # C-h/j/k/l between nvim & tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'     # prefix + Ctrl-s / Ctrl-r
set -g @plugin 'tmux-plugins/tmux-continuum'     # auto save/restore
set -g @plugin 'tmux-plugins/tmux-yank'          # robust copy to system clipboard
set -g @plugin 'laktak/extrakto'                 # prefix + Tab: fzf でテキスト抽出コピー

set -g @continuum-restore 'on'

# Keep this at the very bottom
run '~/.tmux/plugins/tpm/tpm'

# prefix + D で現在ディレクトリのdevセッションを起動
bind D run-shell "tmux-dev #{pane_current_path}"

set -g set-clipboard on
set -g allow-passthrough on    # ネスト/SSH 越しの OSC52 クリップボード取りこぼし対策
set -as terminal-features ',xterm-kitty:clipboard'
